name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[ml,pdf,dev]"
      - name: Lint
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples
      - name: Test
        run: python -m pytest --cov=aidisclose --cov-report=term
      - name: Demo
        run: aidisclose demo --out demo-output
      - name: Doctor
        run: aidisclose doctor

  minimum-versions:
    # the oldest supported Python with the lowest declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.*" "pandas==2.0.*" "requests==2.28.*" "beautifulsoup4==4.11.*" \
            "lxml==4.9.*" "PyYAML==6.0.*" "openpyxl==3.1.*" "scikit-learn==1.2.*" "joblib==1.2.*" \
            "pypdf==3.*" pytest
          pip install --no-deps .
      - name: Test
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/aidisclose demo --out demo-output

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build documentation
        run: |
          pip install ".[docs]"
          python scripts/gen_docs.py
          mkdocs build --strict
